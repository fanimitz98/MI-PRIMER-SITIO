<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Formulario</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        /* Mensajes de error legibles sobre cualquier fondo */
        .error:not(:empty) {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 10px;
            border-radius: 6px;
            background: #fff;
            color: #c62828;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <!-- MENÚ LATERAL -->
    <aside class="menu">
        <h2>🎧 FANI</h2>

        <nav>
            <a href="Index.html">🏠 Menú</a>
            <a href="Banda MS.html">🎵 Banda MS</a>
            <a href="Romeo Santos.html">⭐ Romeo Santos</a>
            <a href="Camila.html">💗 Camila</a>
            <a href="Prince Royce.html">🌟 Prince Royce</a>
            <a href="Moy Bobadilla.html">🎤 Moy Bobadilla</a>
            <a href="Aventura.html">🎶 Aventuraa</a>
            <a href="formulario original.html">💜 Suscripción</a>
        </nav>

        <div class="favoritos">
            <p>💜 Tus favoritos</p>
            <p>＋ Crear lista</p>
        </div>
    </aside>

    <!-- FORMULARIO -->
    <main class="contenido" id="formulario">

        <h1>💗 FORMULARIO</h1>
        <p class="subtitulo">Ingresa tus datos correctamente</p>

        <form id="miFormulario" novalidate>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <div class="entrada">
                    <input type="text" id="nombre"
                    placeholder="Escribe tu nombre" maxlength="100">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="paterno">Apellido paterno</label>
                <div class="entrada">
                    <input type="text" id="paterno"
                    placeholder="Apellido paterno" maxlength="100">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="materno">Apellido materno</label>
                <div class="entrada">
                    <input type="text" id="materno"
                    placeholder="Apellido materno" maxlength="100">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="edad">Edad</label>
                <div class="entrada">
                    <input type="text" id="edad"
                    placeholder="Máximo 3 cifras"
                    inputmode="numeric" maxlength="3">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de nacimiento</label>
                <div class="entrada">
                    <input type="date" id="fecha">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="telefono">Número de teléfono</label>
                <div class="entrada">
                    <input type="text" id="telefono"
                    placeholder="10 dígitos"
                    inputmode="numeric" maxlength="10">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <div class="entrada">
                    <input type="email" id="correo"
                    placeholder="ejemplo@gmail.com">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <div class="campo">
                <label for="tarjeta">Número de tarjeta</label>
                <div class="entrada">
                    <input type="text" id="tarjeta"
                    placeholder="16 dígitos"
                    inputmode="numeric" maxlength="16">
                    <span class="estado"></span>
                </div>
                <small class="error"></small>
            </div>

            <button type="submit">ENVIAR FORMULARIO</button>

            <div id="mensaje" role="status"></div>

        </form>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
